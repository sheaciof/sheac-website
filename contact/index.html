<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | SHEAC</title>
  <link rel="icon" href="../images/LOGO.png">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Mukta:wght@400;600&display=swap" rel="stylesheet">

        <p>info@sheac.org.np</p>
        <p>sheaciof7@gmail.com</p>
      </div>
      <div class="card">

        <p>+977 9749798229</p>
      </div>
    </div>
