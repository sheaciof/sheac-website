<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Team | SHEAC Nepal</title>
    <link rel="icon" type="image/png" href="../../images/LOGO.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-[#F7F8F3] text-[#263238] flex flex-col min-h-screen">
    <header class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <img src="../../images/LOGO.png" alt="SHEAC Logo" class="h-12">
                <span class="font-bold text-[#1B5E20]">SHEAC</span>
            </a>
            <a href="/about/" class="text-sm font-semibold text-[#1B5E20]">&larr; Back to About</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow space-y-8">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-[#0F3D13]">Executive Committee</h1>
            <p class="text-gray-600">Self Help Environment Awareness Camp (SHEAC-NEPAL-IOF)</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border text-center space-y-4">
            <img src="../../images/executive team.jpg" alt="SHEAC Executive Committee" class="w-full rounded-xl object-cover max-h-[600px] border">
            <p class="text-xs text-gray-500">Executive Committee Members — IOF Pokhara Campus</p>
        </div>
    </main>

    <footer class="bg-[#0F3D13] text-gray-300 py-6 text-center text-sm">&copy; 2026 SHEAC Nepal.</footer>

</html>
