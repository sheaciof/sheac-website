<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Network | SHEAC Nepal</title>
    <link rel="icon" type="image/png" href="../../images/LOGO.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="bg-[#F7F8F3] text-[#263238] flex flex-col min-h-screen">
    <header class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <img src="../../images/LOGO.png" alt="SHEAC Logo" class="h-12">
                <span class="font-bold text-[#1B5E20]">SHEAC</span>
            </a>
            <a href="/about/" class="text-sm font-semibold text-[#1B5E20]">&larr; Back to About</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow space-y-6">
        <h1 class="text-3xl font-bold text-[#0F3D13]">SHEAC Alumni Network</h1>
        <p class="text-gray-600">Connecting previous leaders, researchers, and environmentalists worldwide.</p>
        <div class="bg-white p-8 rounded-2xl border text-center space-y-4">
            <h3 class="font-bold text-lg text-[#1B5E20]">Are you a former SHEAC member?</h3>
            <p class="text-sm text-gray-600 max-w-lg mx-auto">Stay connected with our initiatives and mentor the next generation of eco-advocates.</p>
            <a href="mailto:info@sheac.org.np?subject=Alumni%20Registration" class="inline-block px-6 py-3 bg-[#1B5E20] text-white font-semibold rounded-xl text-sm">Register with Alumni Network</a>
        </div>
    </main>

    <footer class="bg-[#0F3D13] text-gray-300 py-6 text-center text-sm">&copy; 2026 SHEAC Nepal.</footer>
</body>
</html>
